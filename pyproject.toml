[project]
name = "hausa-lm"
version = "0.1.0"
authors = [{ name = "Abdoul Majid O. Thiombiano" }]
description = "Language models for Hausa"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chex>=0.1.91",
    "dacite>=1.9.2",
    "datasets>=4.8.4",
    "dm-pix>=0.4.4",
    "einops>=0.8.2",
    "flax>=0.12.7",
    "grain>=0.2.16",
    "hydra-core>=1.3.2",
    "jax[cuda13]>=0.10.0",
    "jaxtyping>=0.3.9",
    "matplotlib>=3.10.9",
    "optax>=0.2.8",
    "orbax>=0.1.9",
    "pillow>=12.2.0",
    "tensorflow>=2.21.0",
    "transformers>=5.6.2",
]

[dependency-groups]
dev = ["torch>=2.11.0"]
